<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Word Crawler</title>
<script>
function crawlWebsite() {
    var url = document.getElementById('websiteUrl').value;
    var keyword = document.getElementById('keyword').value;

    fetch(url)
    .then(response => response.text())
    .then(data => {
        var parser = new DOMParser();
        var htmlDoc = parser.parseFromString(data, 'text/html');
        var bodyText = htmlDoc.body.textContent.toLowerCase();

        if (bodyText.includes(keyword.toLowerCase())) {
            alert('Keyword found on the website!');
        } else {
            alert('Keyword not found on the website.');
        }
    })
    .catch(error => {
        alert('Error fetching website: ' + error);
    });
}
</script>
</head>
<body>
    <h1>Website Word Crawler</h1>
    <p>Paste a website link and a keyword below to check if the keyword exists on the website.</p>
    <input type="text" id="websiteUrl" placeholder="Enter website URL">
    <br><br>
    <input type="text" id="keyword" placeholder="Enter keyword to search">
    <br><br>
    <button onclick="crawlWebsite()">Crawl Website</button>
</body>
</html>
